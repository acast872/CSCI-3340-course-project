{% extends "base.html" %}
{% block title %}Account Manager{% endblock %}
{% block content %}
  <h1>Users</h1>
  <table>
    <thead>
      <tr><th>ID</th><th>Username</th><th>Email</th><th>Staff</th><th>Active</th></tr>
    </thead>
    <tbody>
      {% for u in users %}
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.username }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.is_staff }}</td>
          <td>{{ u.is_active }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="5">No users yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
