{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<style>
  .background-fade {
    position: relative;
    overflow: hidden;
  }

  .background-fade::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("/static/images/d20.png"); /* change to your file path */
    background-size: 60%;          /* adjust size */
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.17;                 /* fade effect */
    z-index: -1;
  }

  .content-wrapper {
    position: relative;
    z-index: 10;
  }
</style>

<div class="background-fade">
  <div class="content-wrapper">
    <h1>Welcome</h1>

    {% if user.is_authenticated %}
      <p>Hi {{ user.username }}!</p>
    {% else %}
      <p><a href="{% url 'login' %}">Log in</a> or <a href="{% url 'signup' %}">create an account</a>.</p>
    {% endif %}
  </div>
</div>

{% endblock %}
