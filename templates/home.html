{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="home-container">
  <h1>Welcome</h1>

  {% if user.is_authenticated %}
    <p class="home-text">Hi {{user.first_name}} {{user.last_name}}!</p>
  {% else %}
    <p class="home-text">
      <a href="{% url 'login' %}">Log In</a>
      or
      <a href="{% url 'signup' %}">Create An Account</a>
    </p>
  {% endif %}
</div>
{% endblock %}
