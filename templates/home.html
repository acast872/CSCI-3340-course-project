{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <h1>Welcome</h1>
  {% if user.is_authenticated %}
    <p>Hi {{ user.username }}!</p>
  {% else %}
    <p><a href="{% url 'login' %}">Log in</a> or <a href="{% url 'signup' %}">create an account</a>.</p>
  {% endif %}
{% endblock %}
