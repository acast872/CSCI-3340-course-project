{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-container">
  <h1>Create an account</h1>

  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn">Sign up</button>
  </form>

  <p class="auth-footer">
    Already have an account?
    <a href="{% url 'login' %}">Log in</a>
  </p>
</div>
{% endblock %}
