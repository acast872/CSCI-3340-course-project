{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
  <h1>Login</h1>

  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn">Log in</button>
  </form>

  <p class="auth-footer">
    Don’t have an account?
    <a href="{% url 'signup' %}">Sign up</a>
  </p>
</div>
{% endblock %}
