{% extends "base.html" %}
{% block title %}Create Meetup{% endblock %}

{% block content %}
<h1>Host a Meetup</h1>

<form method="post">
  {% csrf_token %}
  <fieldset>
    <legend>Meetup Info</legend>
    {{ info_form.as_p }}
  </fieldset>

  <fieldset>
    <legend>Schedule & Room</legend>
    {{ meetup_form.as_p }}
  </fieldset>

  <button type="submit">Add Meetup</button>
</form>
{% endblock %}
