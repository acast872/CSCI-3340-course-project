{% extends "base.html" %}
{% block content %}

<h2>Create Announcement</h2>

<form method="post">
  {% csrf_token %}

  <div class="mb-3">
    {{ form.title.label_tag }}
    {{ form.title }}
  </div>

  <div class="mb-3">
    {{ form.content.label_tag }}
    {{ form.content }}
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>

{% endblock %}
